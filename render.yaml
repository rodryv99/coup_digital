services:
  - type: web
    name: coup-digital-backend
    runtime: docker
    dockerfilePath: ./apps/backend/Dockerfile
    dockerContext: ./apps/backend
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: JWT_EXPIRATION
        value: 15m
      - key: JWT_REFRESH_EXPIRATION
        value: 7d
      - key: DATABASE_URL
        fromDatabase:
          name: coup-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: coup-redis
          type: redis
          property: connectionString

  - type: redis
    name: coup-redis
    plan: free
    maxmemoryPolicy: noeviction
    ipAllowList:
      - source: 0.0.0.0/0
        description: Permite conexiones desde cualquier lugar

databases:
  - name: coup-db
    plan: free
    databaseName: coup_db
    user: coup_user